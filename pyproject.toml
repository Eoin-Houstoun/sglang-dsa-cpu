[project]
name = "sglang-dsa-cpu"
version = "0.1.0"
description = "DeepSeek Sparse Attention (GLM-5.2 shape) on CPU: benchmark harness for the missing SGLang CPU path"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "numpy>=1.26", "pytest>=8"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
